<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <title>FinApp — Finanças Pessoais</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="app-header">
    <span class="logo">Fin<span class="accent">App</span></span>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema">◐</button>
    <button class="sync-badge" id="syncBadge" title="Sincronizar agora">
      <span class="dot"></span><span id="syncLabel">local</span>
    </button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view"></main>

  <button class="fab" id="fab" title="Novo lançamento">+</button>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
